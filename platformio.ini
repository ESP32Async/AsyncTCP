[platformio]
default_envs = arduino-2, arduino-3, arduino-libretiny
; src_dir = examples/Client
; src_dir = examples/FetchWebsite
src_dir = examples/AsyncSend

; Settings shared by every build that targets real hardware.  This cannot be [env],
; because [env] also applies to [env:native], which has no board and no framework.
[target]
framework = arduino
; Build the repository as the library it is, so library.json drives the build
; rather than lib_dir treating the repository root as a folder of libraries.
lib_deps = symlink://.
; The host suite is for [env:native]; there is nothing to flash to a board.
test_ignore = test_native
build_flags = 
  -Wall -Wextra
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
  -D CONFIG_ASYNC_TCP_STACK_SIZE=4096
  ; -D CONFIG_ARDUHAL_LOG_COLORS
  ; -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_VERBOSE
  ; -D USE_ESP_IDF_LOG=1
  ; -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
  ; -D CONFIG_ASYNC_TCP_DEBUG
upload_protocol = esptool
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, log2file
board = esp32dev

[env:arduino-2]
extends = target
platform = espressif32@6.12.0

[env:arduino-3]
extends = target
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

[env:arduino-libretiny]
extends = target
platform = libretiny
board = generic-bk7231n-qfn32-tuya
; board = generic-rtl8710bn-2mb-788k
build_flags =
  ${target.build_flags}
  -Wno-unused-parameter
  -Wno-unused-variable
  -Wno-missing-field-initializers
; use FreeRTOS v9.0.0 for RTL8710BN
; (BK7231 already uses it)
custom_versions.freertos = 9.0.0

;  CI

[env:ci-arduino-2]
extends = target
platform = espressif32@6.12.0
board = ${sysenv.PIO_BOARD}

[env:ci-arduino-3]
extends = target
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = ${sysenv.PIO_BOARD}

[env:ci-arduino-2-esp-idf_log]
extends = target
platform = espressif32@6.12.0
board = ${sysenv.PIO_BOARD}
build_flags =
  ${target.build_flags}
  -D USE_ESP_IDF_LOG=1
  -D TAG=\"core\"

[env:ci-arduino-3-esp-idf_log]
extends = target
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = ${sysenv.PIO_BOARD}
build_flags =
  ${target.build_flags}
  -D USE_ESP_IDF_LOG=1

[env:ci-arduino-libretiny]
extends = target
platform = libretiny
board = ${sysenv.PIO_BOARD}
build_flags =
  ${target.build_flags}
  -Wno-unused-parameter
  -Wno-unused-variable
  -Wno-missing-field-initializers
custom_versions.freertos = 9.0.0

;  Host-native tests -- see test/test_native/README.md
;
;  pio test -e native
;  pio test -e native-asan
;  pio test -e native-no-ipv6
;  pio test -e native-no-core-locking

[env:native]
platform = native
test_framework = unity
; Exceptions must stay on, for C as well as C++: the mock FreeRTOS unwinds out of the
; library's task loop to end a pump, and a failed assertion unwinds out of Unity to end
; the test (see test/test_native/unity_config.h).
; Locals start out filled with 0xfe, as fresh heap memory does (see test_main.cpp), so a
; value read before it was written is the same on every run.
build_flags =
  -std=gnu++17
  -g -O0 -fexceptions
  -ftrivial-auto-var-init=pattern
  -Wall -Wextra -Wno-unused-parameter -Wno-missing-field-initializers -Wno-format
  -I src
  -I test/test_native/mocks/include
  -D ASYNCTCP_NATIVE_TEST=1
  -D ARDUINO=10812
  -D CONFIG_LWIP_TCPIP_CORE_LOCKING=1
  -D CONFIG_ASYNC_TCP_RUNNING_CORE=-1
  -D CONFIG_ASYNC_TCP_USE_WDT=1
  -D CONFIG_ASYNC_TCP_TASK_STACK_SIZE=8192
  -D CONFIG_ASYNC_TCP_TASK_PRIORITY=3
  -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
  -D CONFIG_ASYNC_TCP_PRIORITY=10
  -D CONFIG_ASYNC_TCP_QUEUE_SIZE=64
  -D CONFIG_ASYNC_TCP_STACK_SIZE=8192

; Leak detection earns its keep here: ownership of connections and buffers passes
; between the application, the library and LwIP, and a dropped owner surfaces as a leak
; rather than as a crash.  Each test is forked, so a leak is reported against the test
; that caused it.  Undefined behavior is fatal, so it fails the test rather than
; scrolling past.
[env:native-asan]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -fsanitize=address,undefined
  -fno-sanitize-recover=undefined
  -fno-omit-frame-pointer

; LwIP built for IPv4 only, as LibreTiny builds it: ip_addr_t is then plain ip4_addr_t.
[env:native-no-ipv6]
extends = env:native
build_flags =
  ${env:native.build_flags}
  -D LWIP_IPV6=0

; LwIP without core locking, as ESP-IDF builds it by default and LibreTiny always
; does: raw tcp_* calls are then safe only on the LwIP thread.
[env:native-no-core-locking]
extends = env:native
build_unflags = -D CONFIG_LWIP_TCPIP_CORE_LOCKING=1
